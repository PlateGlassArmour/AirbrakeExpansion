// Optional TweakScale / TweakScale Rescaled support.
// Each patch only runs when a GameData/TweakScale installation is present.
// No ModuleManager or TweakScale dependency for the base mod.
// Duplicate-module guard avoids overwriting other support patches.
// Use explicit part names (not regex/OR syntax in a PART name selector).
// TweakScale's standard surface profile offers 25/50/100/200% sizes.
// Effects on aero/cargo in resized parts require in-game validation.
@PART[AEXFastTwitch]:HAS[!MODULE[TweakScale]]:NEEDS[TweakScale]:FOR[AirbrakeExpansion]
{
    MODULE
    {
        name = TweakScale
        type = surface
    }
}

