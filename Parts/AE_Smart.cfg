// Airbrake Expansion: automatically limits requested aerodynamic braking.
// Smart protection requires the independently built AirbrakeExpansion.dll.
PART
{
    name = AEXSmart
    module = Part
    author = AirbrakeExpansion

    MODEL
    {
        model = Squad/Parts/Aero/airbrake/Airbrake
    }
    rescaleFactor = 1
    node_attach = 0, 0, -0.025, 0, 0, 1, 1
    attachRules = 0,1,0,0,1

    TechRequired = experimentalAerodynamics
    entryCost = 34000
    cost = 2450
    category = Aero
    subcategory = 0
    title = AEX Smart Airbrake
    manufacturer = C7 Experimental Aerodynamics
    description = An entry-rated airbrake with a load-aware deployment controller. Set the G-force ceiling slightly below your craft's tolerance and activate Brakes to request drag; the mechanism automatically adjusts its opening to reduce overload. Independent thermal protection closes a dangerously hot panel and can be disabled at your own risk. Limits are not guarantees of survival.
    tags = aex airbrake airbrakes airbraking aerobrake aerodynamic atmosphere brake brakes speedbrake drag flap smart automatic adaptive controlled safe safety limiter gforce gees gload acceleration deceleration overheat heat thermal reentry re-entry descent entry

    mass = 0.14
    dragModelType = none
    maximum_drag = 0.02
    minimum_drag = 0.02
    angularDrag = 2
    crashTolerance = 12
    maxTemp = 3100
    skinMaxTemp = 3250
    thermalMassModifier = 4.5
    emissiveConstant = 0.82
    heatConductivity = 0.07
    bulkheadProfiles = srf
    fuelCrossFeed = False

    MODULE
    {
        name = ModuleAeroSurface
        useInternalDragModel = true
        dragCoeff = 0.65
        deflectionLiftCoeff = 0.45
        ctrlSurfaceRange = 70
        ctrlSurfaceArea = 1.0
        actuatorSpeed = 95
        transformName = Flap
        defaultActionGroup = Brakes
        liftingSurfaceCurve = SpeedBrake
        ignorePitch = true
        ignoreYaw = true
        ignoreRoll = true
    }
    MODULE
    {
        name = ModuleSmartAirbrake
        gLimit = 7
        thermalProtection = true
        maxDeployAngle = 70
        tripTemperatureRatio = 0.90
        resetTemperatureRatio = 0.80
        gHeadroom = 0.35
        gDeadband = 0.20
        gFilterSeconds = 0.25
        trendFilterSeconds = 0.50
        gPredictionSeconds = 0.45
        reopenDelaySeconds = 0.75
        openingSpeed = 0.20
        closingSpeed = 0.70
        emergencyClosingSpeed = 2.50
        proportionalGain = 0.30
    }
    MODULE
    {
        name = FXModuleLookAtConstraint
        CONSTRAINLOOKFX
        {
            targetName = PistonArm
            rotatorsName = PistonBase
        }
        CONSTRAINLOOKFX
        {
            targetName = PistonBase
            rotatorsName = PistonArm
        }
    }
    MODULE
    {
        name = ModuleCargoPart
        packedVolume = 750
    }
}
