// Airbrake Expansion: slow, oversized, strengthened atmospheric brake.
PART
{
    name = AEXRobust
    module = Part
    author = AirbrakeExpansion

    MODEL
    {
        model = Squad/Parts/Aero/airbrake/Airbrake
        scale = 1.18, 1.18, 1.18
    }
    rescaleFactor = 1
    node_attach = 0, 0, -0.030, 0, 0, 1, 1
    attachRules = 0,1,0,0,1

    TechRequired = heavyAerodynamics
    entryCost = 22000
    cost = 1650
    category = Aero
    subcategory = 0
    title = AEX Robust Airbrake
    manufacturer = C7 Experimental Aerodynamics
    description = A reinforced brake for spacecraft that need extra drag where ordinary panels would burn away. Thick hinges and sluggish actuators favour durability over manoeuvring finesse. There is no automatic G-load limiter: watch your forces during entry.
    tags = aex airbrake airbrakes airbraking aerobrake aerodynamic atmosphere brake brakes speedbrake drag flap robust reinforced durable heavy slow thermal heat hot reentry re-entry descent hypersonic entry

    mass = 0.15
    dragModelType = none
    maximum_drag = 0.02
    minimum_drag = 0.02
    angularDrag = 2
    crashTolerance = 16
    maxTemp = 2750
    skinMaxTemp = 2950
    thermalMassModifier = 5
    emissiveConstant = 0.78
    heatConductivity = 0.08
    bulkheadProfiles = srf
    fuelCrossFeed = False

    MODULE
    {
        name = ModuleAeroSurface
        useInternalDragModel = true
        dragCoeff = 0.78
        deflectionLiftCoeff = 0.5
        ctrlSurfaceRange = 70
        ctrlSurfaceArea = 1.25
        actuatorSpeed = 9
        transformName = Flap
        defaultActionGroup = Brakes
        liftingSurfaceCurve = SpeedBrake
        ignorePitch = true
        ignoreYaw = true
        ignoreRoll = true
    }
    MODULE
    {
        name = FXModuleLookAtConstraint
        CONSTRAINLOOKFX
        {
            targetName = PistonArm
            rotatorsName = PistonBase
        }
        CONSTRAINLOOKFX
        {
            targetName = PistonBase
            rotatorsName = PistonArm
        }
    }
    MODULE
    {
        name = ModuleCargoPart
        packedVolume = 1400
    }
}
