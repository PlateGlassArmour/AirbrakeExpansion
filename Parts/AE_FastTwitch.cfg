// Airbrake Expansion: small, rapid aerodynamic attitude helper.
// This is a new definition that references the existing Squad airbrake model.
PART
{
    name = AEXFastTwitch
    module = Part
    author = AirbrakeExpansion

    MODEL
    {
        model = Squad/Parts/Aero/airbrake/Airbrake
        scale = 0.55, 0.55, 0.55
    }
    rescaleFactor = 1
    node_attach = 0, 0, -0.014, 0, 0, 1, 1
    attachRules = 0,1,0,0,1

    TechRequired = specializedControl
    entryCost = 8500
    cost = 750
    category = Aero
    subcategory = 0
    title = AEX Fast Twitch Airbrake
    manufacturer = C7 Experimental Aerodynamics
    description = A compact airbrake with an unusually energetic actuator. Its job is rapid aerodynamic attitude corrections, not surviving a fiery entry. Place pairs well away from the centre of mass and watch the hinge orientation.
    tags = aex airbrake airbrakes airbraking aerobrake aerodynamic atmosphere brake brakes speedbrake control surface flap twitch rapid fast agile stabilizer stabilize tumble tumbling pitch yaw attitude steering maneuver manoeuvre small

    mass = 0.055
    dragModelType = none
    maximum_drag = 0.02
    minimum_drag = 0.02
    angularDrag = 2
    crashTolerance = 6
    maxTemp = 2000
    skinMaxTemp = 2200
    thermalMassModifier = 2.5
    emissiveConstant = 0.6
    heatConductivity = 0.12
    bulkheadProfiles = srf
    fuelCrossFeed = False

    MODULE
    {
        name = ModuleAeroSurface
        useInternalDragModel = true
        dragCoeff = 0.22
        deflectionLiftCoeff = 0.30
        ctrlSurfaceRange = 65
        ctrlSurfaceArea = 0.5
        actuatorSpeed = 240
        transformName = Flap
        liftingSurfaceCurve = SpeedBrake
        ignorePitch = false
        ignoreYaw = false
        ignoreRoll = true
        // Deliberately not in Brakes: this variant is primarily a controller.
    }
    MODULE
    {
        name = FXModuleLookAtConstraint
        CONSTRAINLOOKFX
        {
            targetName = PistonArm
            rotatorsName = PistonBase
        }
        CONSTRAINLOOKFX
        {
            targetName = PistonBase
            rotatorsName = PistonArm
        }
    }
    MODULE
    {
        name = ModuleCargoPart
        packedVolume = 350
    }
}
